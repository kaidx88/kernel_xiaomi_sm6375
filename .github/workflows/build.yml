name: Compilar Positron KSU-Next (Definitivo)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Liberar espacio
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Integrar KernelSU-Next (Legacy)
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
        cd KernelSU-Next && git fetch --tags || true && cd ..
        grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
        grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

    - name: Instalar Clang y Dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache cpio curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf kmod lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop python3 rsync schedtool squashfs-tools xsltproc xz-utils zip zlib1g-dev
        mkdir -p clang
        curl -LSs "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-Linux-X64.tar.xz" | tar -xJ --strip-components=1 -C clang

    - name: Compilar Kernel
      run: |
        # TRUCO MAESTRO: Obliga al sistema a mostrar el error sin ocultarlo
        set -o pipefail 

        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64

        DEFCONFIG=$(cd arch/arm64/configs && find . -type f -name "*veux*" 2>/dev/null | head -n 1 | sed 's|^\./||')

        # DESTRUIR WERROR EN TODO EL KERNEL PARA EVITAR FALSOS POSITIVOS
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) -exec sed -i 's/-Werror\b//g' {} +

        # INYECTAR KPROBES Y ROOT
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_KPROBE_HOOKS=y" >> arch/arm64/configs/$DEFCONFIG

        make O=out $DEFCONFIG CC=clang LLVM=1 LLVM_IAS=1

        # APAGAR LTO Y REGLAS ESTRICTAS
        ./scripts/config --file out/.config -d LTO -d LTO_CLANG -d CFI_CLANG -e LTO_NONE -d WERROR -d ERROR_ON_WARNING -d MODULE_SIG_FORCE -d JUMP_LABEL
        make O=out olddefconfig CC=clang LLVM=1 LLVM_IAS=1

        echo "=== COMPILACION PESADA ==="
        make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" KBUILD_CFLAGS="-Wno-error" Image 2>&1 | tee build.log || {
          echo "=========================================================="
          echo "❌ ERROR FATAL DETECTADO - TOMA CAPTURA DE ESTE BLOQUE ❌"
          echo "=========================================================="
          grep -i -E "error:|fatal " build.log | grep -v -i "ext4_error" | tail -n 25
          exit 1
        }

    - name: Subir Image
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: Image-KSU-Next
        path: out/arch/arm64/boot/Image
