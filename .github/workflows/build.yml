name: Compilar Positron con KernelSU Next (5.4 Legacy)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Liberar espacio y activar Swap
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h
        df -h

    - name: Descargar código fuente del Kernel
      uses: actions/checkout@v4

    - name: Integrar KernelSU Next (Rama Legacy para 5.4)
      run: |
        rm -rf KernelSU KernelSU-Next drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
        if [ ! -e "drivers/kernelsu/Kconfig" ]; then
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          git clone -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          cd KernelSU-Next && git fetch --tags || true && cd ..
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
        fi
        grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
        grep -q "kernelsu" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        ls -la drivers/kernelsu/

    - name: Preparar entorno de compilación
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache cpio curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf kmod lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop python3 python-is-python3 rsync schedtool squashfs-tools xsltproc xz-utils zip zlib1g-dev
        mkdir -p clang
        curl -LSs "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-Linux-X64.tar.xz" | tar -xJ --strip-components=1 -C clang

    - name: Compilar Kernel con Verificación de Root
      run: |
        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64

        if [ -f arch/arm64/configs/vendor/veux-perf_defconfig ]; then
          DEFCONFIG="vendor/veux-perf_defconfig"
        elif [ -f arch/arm64/configs/vendor/veux_defconfig ]; then
          DEFCONFIG="vendor/veux_defconfig"
        else
          DEFCONFIG=$(cd arch/arm64/configs && find . -type f -name "*veux*" 2>/dev/null | head -n 1 | sed 's|^\./||')
        fi

        echo "Usando defconfig: $DEFCONFIG"
        
        # Inyectar variables de root al archivo base
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU=y" >> arch/arm64/configs/$DEFCONFIG
        echo "CONFIG_KSU_KPROBE_HOOKS=y" >> arch/arm64/configs/$DEFCONFIG

        make O=out $DEFCONFIG CC=clang LLVM=1 LLVM_IAS=1

        # Limpiar configuración estricta 
        ./scripts/config --file out/.config \
          -d MODULE_SIG_FORCE \
          -d DEBUG_INFO \
          -d ERROR_ON_WARNING \
          -d WERROR \
          --set-val FRAME_WARN 0

        make O=out olddefconfig CC=clang LLVM=1 LLVM_IAS=1

        # FORZAR apagado de funciones conflictivas DESPUÉS de que el kernel arme la configuración
        sed -i 's/CONFIG_JUMP_LABEL=y/# CONFIG_JUMP_LABEL is not set/g' out/.config
        sed -i 's/CONFIG_WERROR=y/# CONFIG_WERROR is not set/g' out/.config

        echo "=== ESTADO DE CONFIGURACION KSU ==="
        grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_JUMP_LABEL" out/.config

        # Compilar bloqueando todos los errores de advertencia en C y ensamblador
        make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" KBUILD_CFLAGS="-Wno-error" Image

        echo "=== VERIFICANDO QUE KSU SE COMPILO DENTRO DEL KERNEL ==="
        if [ ! -f "out/drivers/kernelsu/built-in.a" ] && [ ! -f "out/drivers/kernelsu/ksu.o" ]; then
          echo "ERROR CRITICO: KernelSU-Next no se compilo dentro del kernel."
          exit 1
        fi
        echo "EXITO: Driver de KernelSU-Next compilado e inyectado en Image."

    - name: Subir archivo Image
      uses: actions/upload-artifact@v4
      with:
        name: Image-KSU-Next-Legacy
        path: out/arch/arm64/boot/Image
        
